name: Security

on:
  pull_request:
    branches: [main]

# Least-privilege default; individual jobs widen scope only where required.
permissions:
  contents: read

jobs:
  # Blocks a PR that ADDS (or bumps to) a dependency with a known high/critical
  # advisory, using GitHub's dependency graph for the PR diff so reviewers get a
  # clear "this change introduced the vuln" signal.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are pinned to a full-length commit SHA (not a
      # moving tag) to prevent supply-chain attacks via mutated/retagged refs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Auto-discovers EVERY requirements file in the repo and audits each against
  # the PyPI/OSV advisory databases, so a newly added nested folder is covered
  # automatically — no hardcoded path list to forget (which is how the demo/
  # blind spot happened). Shipped paths BLOCK the PR; test / dev / example /
  # blind-spot paths are report-only. pip-audit fails on ANY known advisory.
  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned version to keep the tool off the supply-chain attack surface.
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Logic lives in a script file so the Actions log stays clean — only this
      # one line is echoed, not the whole loop.
      - name: Audit every requirements file (block shipped, report-only test/dev)
        run: bash .github/scripts/pip-audit.sh

  # Static analysis (SAST) for the SDK source — catches injection/insecure
  # patterns in our own code, complementing the dependency checks above.
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
