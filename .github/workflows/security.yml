name: Security

on:
  pull_request:
    branches: [main]

# Least-privilege default; individual jobs widen scope only where required.
permissions:
  contents: read

jobs:
  # Blocks a PR that ADDS (or bumps to) a dependency with a known high/critical
  # advisory, using GitHub's dependency graph for the PR diff so reviewers get a
  # clear "this change introduced the vuln" signal.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are pinned to a full-length commit SHA (not a
      # moving tag) to prevent supply-chain attacks via mutated/retagged refs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Auto-discovers EVERY requirements file in the repo and audits each against
  # the PyPI/OSV advisory databases, so a newly added nested folder is covered
  # automatically — no hardcoded path list to forget (which is how the demo/
  # blind spot happened). Shipped paths BLOCK the PR; test / dev / example /
  # blind-spot paths are report-only. pip-audit fails on ANY known advisory.
  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      # Pinned version to keep the tool off the supply-chain attack surface.
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit every requirements file (block shipped, report-only test/dev)
        shell: bash
        run: |
          set -uo pipefail
          shipped_failed=0
          while IFS= read -r req; do
            # Classify: test/dev/example/blind-spot path or filename => report-only.
            case "$req" in
              *demo*|*example*|*e2e*|*fixture*|*sample*|*test*|*spec*|*dev*) mode=report-only ;;
              *) mode=blocking ;;
            esac
            echo "::group::pip-audit ($mode): $req"
            if pip-audit -r "$req"; then
              echo "clean: $req"
            elif [ "$mode" = blocking ]; then
              echo "::error::known advisory in shipped path: $req"
              shipped_failed=1
            else
              echo "::warning::known advisory in report-only path: $req (not blocking)"
            fi
            echo "::endgroup::"
          done < <(find . -name 'requirements*.txt' -not -path '*/.git/*' | sort)
          exit $shipped_failed

  # Static analysis (SAST) for the SDK source — catches injection/insecure
  # patterns in our own code, complementing the dependency checks above.
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
